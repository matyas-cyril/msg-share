---
# vars file for antivirus

# Définir la valeur du cache par défaut.
# Si < 0 alors la mise à jour du cache est désactivée
_apt_cache_valid_time: "{%- if apt_cache_valid_time is not defined -%}3600 | int {%- elif apt_cache_valid_time | int < 0 -%}{{ -1 |int }}{%- else -%}{{ apt_cache_valid_time | int }}{%- endif -%}"

# Activer ou nom la MAJ de cache
_apt_update_cache: "{%- if _apt_cache_valid_time | int < 0 -%}{{ false | bool }}{%- else -%}{{ true | bool }}{%- endif -%}"

##### Freshclam
# Définir la durée en (jour) de ala recherche des MAJ des bases de l'antivirus
_check_database_days: "{{ (clamav_check_database_days | default(24) | int) if (clamav_check_database_days is not none) else 24 }}"

# Mirroir pour les MAJ de l'antivirus
_clamav_private_mirror: "{{ (clamav_private_mirror | default('') | string | trim ) }}"

# Définir la fréquence des purges de quarantaine. Par défaut on met 40 jours.
_date_quaratine_file: "{{ (amavis_quarantine_purge | default(30) | int) }}"
