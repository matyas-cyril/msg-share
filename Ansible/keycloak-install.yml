---

- hosts: localhost
  gather_facts: no

  tasks:
    - name: "Démarrer les services Docker Keycloak"
      command: docker compose -f ../Docker/plateform.yml --env-file ../dot.env up keycloak -d --remove-orphans
      tags:
        - always

- hosts: keycloak_server
  gather_facts: yes
  tasks:
    - name: "Initialiser keycloak"
      block:
        - include_role:
            name: keycloak
          tags:
            - install
      rescue:
        - debug:
            msg: "Erreur lors de l'initialisation du serveur Keycloak"

- hosts: roundcube_webmail
  gather_facts: no
  tasks:
    - name: "Prise en compte des certificats Keycloak dans Roundcube"
      command: "update-ca-certificates"
      tags:
        - install

- hosts: proxy_dovecot
  gather_facts: no
  tasks:
    - name: "Prise en compte des certificats Keycloak dans Dovecot"
      command: "update-ca-certificates"
      tags:
        - install
